name: Build Desktop (macOS + Windows)

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: "--target universal-apple-darwin"
          - os: windows-latest
            args: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      - name: Rust targets (macOS universal)
        if: matrix.os == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Node.js setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Disable Tauri updater for CI builds (no signing key required)
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const path = 'src-tauri/tauri.conf.json';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));

          if (data.bundle) {
            data.bundle.createUpdaterArtifacts = false;
          }

          if (data.plugins && data.plugins.updater) {
            data.plugins.updater.active = false;
            data.plugins.updater.endpoints = [];
          }

          fs.writeFileSync(path, JSON.stringify(data, null, 2));
          console.log('Patched', path);
          NODE

      - name: Build (Tauri)
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-tools-${{ matrix.os }}
          path: |
            src-tauri/target/**/release/bundle/dmg/*.dmg
            src-tauri/target/**/release/bundle/macos/*.app.tar.gz
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/antigravity_tools*
          if-no-files-found: warn
